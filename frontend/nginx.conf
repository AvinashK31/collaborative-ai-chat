server {
    listen 80;
    server_name _;

    # Serve static frontend assets
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend service.  The backend
    # container name is "backend" in docker‑compose.  Adjust the
    # proxy_pass target if you expose a different port or route.
    location /api/ {
        proxy_pass http://backend:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Fallback for client‑side routing: serve index.html for
    # unknown routes so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}